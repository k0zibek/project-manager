services:
  - type: web
    name: project-manager-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build -w @project-manager/api
    startCommand: npm run start -w @project-manager/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        value: file:/data/app.db
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
